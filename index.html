<script>

    darkMode: 'class',
    theme: {
      extend: {
        colors: {
          tg: {
            bg: 'var(--tg-bg)',
            card: 'var(--tg-card)',
            secondary: 'var(--tg-secondary)',
            text: 'var(--tg-text)',

    <style>
      :root {
        --tg-bg: #0f1014;
        --tg-card: #1c1e26;
        --tg-secondary: #252836;
        --tg-text: #f5f5f7;
        --tg-muted: #8b9bb4;
        --tg-accent: #6366f1;
        --tg-gold: #d4af37;
      }

      body {
        background-color: var(--tg-bg);
        color: var(--tg-text);
        font-family: 'Inter', sans-serif;
        transition: background-color 0.3s ease, color 0.3s ease;
      }

      #root { min-height: 100vh; }

      /* Лоадер */
      .loader { 
        position: fixed; 
        top: 50%; 
        left: 50%; 
        transform: translate(-50%, -50%); 
        width: 50px; 
        height: 50px; 
        border: 4px solid rgba(255, 255, 255, 0.1); 
        border-top-color: #31a24c; 
        border-radius: 50%; 
        animation: spin 1s linear infinite; 
        z-index: 9999; 
      }
      @keyframes spin { to { transform: translate(-50%, -50%) rotate(360deg); } }
      #root:not(:empty) ~ .loader { display: none; }

      /* Glass effect для карточек */
      .glass {
        background: color-mix(in srgb, var(--tg-card), transparent 30%);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.05);
      }
      .glass-high {
        background: color-mix(in srgb, var(--tg-secondary), transparent 20%);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border-top: 1px solid rgba(255, 255, 255, 0.1);
      }
    </style>
