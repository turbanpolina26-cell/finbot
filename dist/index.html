<!-- Mobile fixes: hide debug panel and make add forms bottom-fixed and keyboard-friendly -->
<style>
  /* Hide any debug panel / dev overlays if present */
  .debug-panel, #debug-panel, .devtools, .debugOverlay, *[class*="debug"], *[id*="debug"], *[class*="devtools"], .dev-panel { display: none !important; visibility: hidden !important; height: 0 !important; overflow: hidden !important; }

  /* Ensure body height adapts to mobile virtual keyboard using --vh */
  :root { --vh: 1vh; }

  /* Generic bottom sheet / add-form styles to improve mobile usability */
  .add-panel, .add-form, #add-transaction, .transaction-form, .modal, .sheet {
    position: fixed !important;
    left: 0 !important;
    right: 0 !important;
    bottom: 0 !important;
    margin: 0 !important;
    box-shadow: 0 -12px 30px rgba(0,0,0,0.4) !important;
    border-top-left-radius: 12px !important;
    border-top-right-radius: 12px !important;
    max-height: calc(var(--vh, 1vh) * 70) !important; /* keep form <= 70% of viewport */
    overflow: auto !important;
    -webkit-overflow-scrolling: touch !important;
    padding: 12px 16px 24px 16px !important;
    background: var(--tg-card) !important;
    z-index: 9999 !important;
  }

  /* Make inputs and buttons more compact inside add forms */
  .add-panel input, .add-panel textarea, .add-panel select,
  .add-form input, .add-form textarea, .add-form select,
  .transaction-form input, .transaction-form textarea, .transaction-form select {
    font-size: 16px !important;
    padding: 10px !important;
    margin: 6px 0 !important;
  }

  /* Ensure the root container uses the --vh sizing to avoid 100vh jumps */
  #root { min-height: calc(var(--vh, 1vh) * 100); }
</style>

<script>
  // Set --vh custom property to avoid 100vh problems on mobile browsers
  function setVh() {
    try {
      var vh = window.innerHeight * 0.01;
      document.documentElement.style.setProperty('--vh', vh + 'px');
    } catch (e) {
      // ignore
    }
  }
  setVh();
  window.addEventListener('resize', setVh);

  // If visualViewport API exists, adjust on visual viewport changes (keyboard open)
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', function () {
      setVh();
      // when keyboard opens, ensure focused input is visible
      const active = document.activeElement;
      if (active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA' || active.isContentEditable)) {
        setTimeout(() => {
          active.scrollIntoView({ block: 'center', behavior: 'smooth' });
        }, 50);
      }
    });
  }
</script>

<style>
  /* Bottom-sheet enhancements */
  .sheet-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 9997; opacity: 0; transition: opacity 220ms ease; }
  .sheet-backdrop.visible { opacity: 1; }
  .sheet { will-change: transform; transition: transform 220ms cubic-bezier(.22,.98,.36,1); touch-action: none; }
  .sheet-header { height: 36px; display:flex; align-items:center; justify-content:center; cursor:grab; }
  .sheet-handle { width: 44px; height: 6px; border-radius: 6px; background: rgba(255,255,255,0.14); }
  .sheet.closed { transform: translateY(120%); }
  .sheet .sheet-footer { position: sticky; bottom: 0; background: transparent; padding-top: 8px; padding-bottom: env(safe-area-inset-bottom, 12px); }
  .sheet .sheet-footer .primary-action { width: 100%; display: block; }
</style>

<script>
  (function(){
    const selectors = ['.add-panel', '.add-form', '#add-transaction', '.transaction-form', '.modal', '.sheet'];
    function enhance(el){
      if (!el || el.dataset.sheetEnhanced) return;
      el.dataset.sheetEnhanced = '1';
      el.classList.add('sheet');
      // Create backdrop
      const backdrop = document.createElement('div');
      backdrop.className = 'sheet-backdrop';
      el.parentNode && el.parentNode.insertBefore(backdrop, el);

      // Add header handle
      const header = document.createElement('div');
      header.className = 'sheet-header';
      const handle = document.createElement('div');
      handle.className = 'sheet-handle';
      header.appendChild(handle);
      el.insertAdjacentElement('afterbegin', header);

      // Ensure overflow and max-height
      el.style.maxHeight = 'calc(var(--vh, 1vh) * 70)';
      el.style.overflow = 'auto';
      el.style.zIndex = 9998;

      // Drag to dismiss
      let startY = 0, currentY = 0, dragging = false;
      function onPointerDown(e){
        dragging = true; startY = e.clientY || (e.touches && e.touches[0].clientY) || 0; el.style.transition = 'none';
        document.addEventListener('pointermove', onPointerMove);
        document.addEventListener('pointerup', onPointerUp);
      }
      function onPointerMove(e){
        if(!dragging) return; currentY = (e.clientY|| (e.touches&&e.touches[0].clientY) || 0) - startY; if(currentY<0) currentY=0; el.style.transform = `translateY(${currentY}px)`; backdrop.style.opacity = String(Math.max(0, 1 - currentY / (el.clientHeight || 300)));
      }
      function onPointerUp(){
        dragging = false; el.style.transition='transform 220ms cubic-bezier(.22,.98,.36,1)';
        const threshold = (el.clientHeight || 300) * 0.25;
        if(currentY > threshold){
          // close
          el.classList.add('closed');
          backdrop.classList.remove('visible');
          setTimeout(()=>{el.style.display='none'; backdrop.style.display='none';}, 240);
        } else {
          // snap back
          el.style.transform = '';
          backdrop.style.opacity = '';
        }
        document.removeEventListener('pointermove', onPointerMove);
        document.removeEventListener('pointerup', onPointerUp);
      }
      header.addEventListener('pointerdown', onPointerDown);

      // Backdrop click closes
      backdrop.addEventListener('click', ()=>{
        el.classList.add('closed'); backdrop.classList.remove('visible'); setTimeout(()=>{el.style.display='none'; backdrop.style.display='none';}, 220);
      });

      // When inputs focus, scroll them into view
      el.addEventListener('focusin', (ev)=>{
        const target = ev.target; if(target && (target.tagName==='INPUT'||target.tagName==='TEXTAREA'||target.isContentEditable)){
          setTimeout(()=>{ target.scrollIntoView({behavior:'smooth', block:'center'}); }, 80);
        }
      });

      // Show backdrop
      requestAnimationFrame(()=>{
        backdrop.classList.add('visible'); backdrop.style.display='block'; el.style.display='block'; el.classList.remove('closed');
      });
    }

    function scanAndEnhance(){
      selectors.forEach(sel=>{
        document.querySelectorAll(sel).forEach(enhance);
      });
    }

    document.addEventListener('DOMContentLoaded', scanAndEnhance);
    // also watch for dynamically added panels
    const mo = new MutationObserver((mutations)=>{ for(const m of mutations) if(m.addedNodes) scanAndEnhance(); });
    mo.observe(document.body, { childList: true, subtree: true });
  })();
</script>
