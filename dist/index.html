              sans: ['Inter', 'system-ui', 'sans-serif'],

            colors: {
              tg: {
                bg: 'var(--tg-bg)',
                card: 'var(--tg-card)',
                secondary: 'var(--tg-secondary)',
                text: 'var(--tg-text)',
                muted: 'var(--tg-muted)',
                accent: 'var(--tg-accent)',

            animation: {
              'fade-in': 'fadeIn 0.3s ease-out',
              'slide-up': 'slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1)',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              slideUp: {
                '0%': { transform: 'translateY(20px)', opacity: '0' },

              }
            }
          }

    <style>
      :root {
        /* Default Theme: Obsidian (Luxury Dark) */
        --tg-bg: #0f1014;
        --tg-card: #1c1e26;
        --tg-secondary: #252836;
        --tg-text: #f5f5f7;
        --tg-muted: #8b9bb4;
        --tg-accent: #6366f1; /* Indigo */
        --tg-gold: #d4af37;
      }

      [data-theme='cotton-candy'] {
        /* Cotton Candy Theme (Pink/Blue/Purple) */
        --tg-bg: #130f26; /* Deep Purple */
        --tg-card: #231b36; /* Lighter Purple */
        --tg-secondary: #2e2448;
        --tg-text: #ffffff;
        --tg-muted: #a69bc9;
        --tg-accent: #ff6ad5; /* Hot Pink */
        --tg-gold: #00e5ff; /* Cyan for "Savings" in this theme */
      }
      
      [data-theme='aurora'] {
        /* Aurora Theme (Light Glass) */
        --tg-bg: #f0f2f5;
        --tg-card: #ffffff;
        --tg-secondary: #e4e6eb;
        --tg-text: #1a1a1a;
        --tg-muted: #65676b;
        --tg-accent: #2d88ff;
        --tg-gold: #e6b800;
      }

      [data-theme='forest'] {
        /* Forest Theme (Nature) */
        --tg-bg: #0d1f12;
        --tg-card: #1a2f21;
        --tg-secondary: #253d2d;
        --tg-text: #e0e7e1;
        --tg-muted: #8ba391;
        --tg-accent: #4ade80;
        --tg-gold: #fbbf24;
      }

      body {
        background-color: var(--tg-bg);
        color: var(--tg-text);
        font-family: 'Inter', sans-serif;
        transition: background-color 0.3s ease, color 0.3s ease;
      }

      /* Hide scrollbar for clean mobile look */
      ::-webkit-scrollbar {
        width: 0px;
        background: transparent;
      }
      
      .glass {
        background: rgba(var(--tg-card), 0.7); /* Fallback */
        background: color-mix(in srgb, var(--tg-card), transparent 30%);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.05);
      }
      
      .glass-high {
        background: color-mix(in srgb, var(--tg-secondary), transparent 20%);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border-top: 1px solid rgba(255, 255, 255, 0.1);
      }
    </style>

<style>
  #root { min-height: 100vh; }
  .loader { 
    position: fixed; 
    top: 50%; 
    left: 50%; 
    transform: translate(-50%, -50%); 
    width: 50px; 
    height: 50px; 
    border: 4px solid rgba(255, 255, 255, 0.1); 
    border-top-color: #31a24c; 
    border-radius: 50%; 
    animation: spin 1s linear infinite; 
    z-index: 9999; 
  }
  @keyframes spin { to { transform: translate(-50%, -50%) rotate(360deg); } }
  #root:not(:empty) ~ .loader { display: none; }
</style>
