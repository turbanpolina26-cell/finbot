name: Keep Cloudflare Worker Warm

on:
  schedule:
    # every 5 minutes
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

jobs:
  ping-worker:
    runs-on: ubuntu-latest
    steps:
      - name: Curl worker health
        run: |
          curl -sSf "https://finbot-proxy-worker.turbanpolina26.workers.dev/health" || true
