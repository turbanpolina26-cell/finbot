# Netlify Configuration for Nura Finance

[build]
  command = "npm run build"
  functions = "backend"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Environment variables (set these in Netlify dashboard)
[context.production.environment]
VITE_CONVEX_URL = "https://vivid-pheasant-557.convex.cloud"
